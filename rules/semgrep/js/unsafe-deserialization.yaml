rules:
  - id: newsoc.js.unsafe-deserialization
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data is deserialised with a library that can execute code (node-serialize). Use JSON.parse for data.
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.url
              - pattern: $REQ.originalUrl
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
    pattern-sinks:
      - pattern-either:
          - pattern: $SER.unserialize(...)
          - pattern: unserialize(...)
    metadata:
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      owasp:
        - "A08:2021 - Software and Data Integrity Failures"
      severity: critical
      confidence: HIGH
      category: security
      provenance: "Written clean-room from the CWE description; no registry rule consulted."
