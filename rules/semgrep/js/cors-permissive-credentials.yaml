rules:
  - id: newsoc.js.cors-permissive-credentials
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      CORS allows any origin together with credentials, so any website can make authenticated requests as the user. Use an explicit allow-list of origins.
    pattern-either:
      - pattern: |
          cors({..., origin: true, ..., credentials: true, ...})
      - pattern: |
          cors({..., credentials: true, ..., origin: true, ...})
      - pattern: |
          cors({..., origin: "*", ..., credentials: true, ...})
      - pattern: |
          cors({..., credentials: true, ..., origin: "*", ...})
    metadata:
      cwe:
        - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      severity: medium
      confidence: HIGH
      category: security
      provenance: "Written clean-room from the CWE description; no registry rule consulted."
