rules:
  - id: newsoc.js.sql-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data is built into an SQL string. Use parameterised queries or placeholders.
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.url
              - pattern: $REQ.originalUrl
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request)$
    pattern-sinks:
      - pattern-either:
          - patterns:
              - pattern: $DB.query($SQL, ...)
              - focus-metavariable: $SQL
          - patterns:
              - pattern: $DB.raw($SQL, ...)
              - focus-metavariable: $SQL
          - patterns:
              - pattern: $DB.execute($SQL, ...)
              - focus-metavariable: $SQL
    pattern-sanitizers:
      - pattern-either:
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Number(...)
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      severity: high
      confidence: HIGH
      category: security
      provenance: "Written clean-room from the CWE description; no registry rule consulted."
