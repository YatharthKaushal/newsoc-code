rules:
  - id: newsoc.py.weak-password-hash
    languages: [python]
    severity: WARNING
    message: >-
      A password appears to be hashed with MD5 or SHA-1, which are fast and broken for this purpose. Use a password hash such as argon2, scrypt or bcrypt.
    patterns:
      - pattern-either:
          - pattern: |
              hashlib.md5($ARG, ...)
          - pattern: |
              hashlib.sha1($ARG, ...)
      - metavariable-regex:
          metavariable: $ARG
          regex: (?i).*(passw|pwd).*
    metadata:
      cwe:
        - "CWE-328: Use of Weak Hash"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      severity: medium
      confidence: MEDIUM
      category: security
      provenance: "Written clean-room from the CWE description; no registry rule consulted."
