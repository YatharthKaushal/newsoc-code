rules:
  - id: newsoc.py.ssrf-requests
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Request data controls the URL of an outgoing request (server-side request forgery). Validate the host against an allow-list.
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.args
              - pattern: $REQ.form
              - pattern: $REQ.json
              - pattern: $REQ.values
              - pattern: $REQ.cookies
              - pattern: $REQ.headers
              - pattern: $REQ.data
              - pattern: $REQ.files
              - pattern: $REQ.GET
              - pattern: $REQ.POST
              - pattern: $REQ.body
              - pattern: $REQ.get_json(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(request|req)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  requests.get($U, ...)
              - pattern: |
                  requests.post($U, ...)
              - pattern: |
                  requests.put($U, ...)
              - pattern: |
                  requests.delete($U, ...)
              - pattern: |
                  requests.head($U, ...)
              - pattern: |
                  httpx.get($U, ...)
              - pattern: |
                  httpx.post($U, ...)
              - pattern: |
                  urllib.request.urlopen($U, ...)
              - pattern: |
                  urlopen($U, ...)
          - focus-metavariable: $U
    metadata:
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - "A10:2021 - Server-Side Request Forgery"
      severity: high
      confidence: HIGH
      category: security
      provenance: "Written clean-room from the CWE description; no registry rule consulted."
